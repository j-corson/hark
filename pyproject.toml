[project]
name = "hark"
version = "0.1.0"
description = "Listen to a conversation and keep a live, structured document, powered by your Claude subscription"
readme = "README.md"
authors = [
    { name = "Mike Fell", email = "79201953+mikefsway@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "cryptography>=50.0.2",
    "numpy>=2.5.4",
    "qrcode>=8.2",
    "sherpa-onnx>=1.13.8",
    "sherpa-onnx-core>=1.13.8",
]

[project.scripts]
hark = "hark:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
