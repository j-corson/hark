<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hark: room screen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f55c9'/%3E%3Cpath d='M9 12h14M9 17h10M9 22h12' stroke='%23ffe45c' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="/static/present.css">
</head>
<body>
<header class="top">
  <span id="title" class="title"></span>
  <span id="held" class="held" hidden title="Chosen by hand or by voice. Claude puts new points here. Press L to follow the conversation again.">Held here</span>
  <button id="elsewhere" class="elsewhere" type="button" hidden></button>
  <span id="looking" class="looking" hidden></span>
  <span id="live" class="live" hidden>Listening</span>
</header>

<main class="stage">
  <section id="card" class="card" aria-live="polite"></section>
  <aside id="rail" class="rail" hidden></aside>
</main>

<div id="agreed" class="agreed" hidden></div>
<aside id="lookup" class="lookup" hidden aria-live="polite" title="Click or press Esc to close"></aside>

<footer class="controls">
  <button id="prevBtn" type="button" title="Previous section (←)">‹</button>
  <button id="followBtn" type="button" title="Follow the conversation (L)">Following</button>
  <button id="nextBtn" type="button" title="Next section (→)">›</button>
  <button id="fsBtn" type="button" title="Full screen (F)">Full screen</button>
</footer>

<script src="/static/md.js"></script>
<script src="/static/present.js"></script>
</body>
</html>
